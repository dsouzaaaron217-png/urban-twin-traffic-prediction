name: Quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install backend dependencies
        run: python -m pip install -r requirements.lock
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.lock
      - name: Test backend with coverage gate
        run: >-
          python -m pytest --cov=main --cov=services --cov=ml
          --cov-report=term-missing:skip-covered --cov-report=xml
          --cov-fail-under=70

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fronted
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Audit frontend dependencies
        run: bun audit
      - name: Lint
        run: bun run lint
      - name: Type check
        run: bun run typecheck
      - name: Unit and component tests
        run: bun run test
      - name: Production build
        run: bun run build
      - name: Install Chromium for browser tests
        run: bunx playwright install --with-deps chromium
      - name: End-to-end browser tests
        run: bun run test:e2e
